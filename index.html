<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Barcode dengan Jeda Waktu (Cooldown)</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Library Html5-Qrcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="text-center mb-4">Scan Barcode (Jeda 10 Detik per Scan)</h2>
        
        <div class="row">
            <!-- Kolom Kamera Scanner -->
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h5>Arahkan Kamera ke Barcode</h5>
                        <div id="reader" style="width: 100%;"></div>
                        
                        <!-- Status Peringatan Jeda Waktu -->
                        <div id="statusScan" class="alert alert-success mt-3 py-2 mb-0" style="font-weight: bold;">
                            Scanner Siap
                        </div>
                    </div>
                </div>
            </div>

            <!-- Kolom Tabel Hasil Scan & Hitung Otomatis -->
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Daftar Barang Terscan</h5>
                            <button class="btn btn-sm btn-outline-danger" onclick="resetData()">Reset Data</button>
                        </div>
                        
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Kode Barcode</th>
                                        <th>Nama Barang</th>
                                        <th class="text-center">Jumlah (Qty)</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelScan">
                                    <tr>
                                        <td colspan="3" class="text-center text-muted">Belum ada barcode yang disscan</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="mt-3 p-3 bg-white border rounded">
                            <h4>Total Keseluruhan Item: <span id="totalQty" class="text-primary">0</span> pcs</h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simulasi database nama barang berdasarkan kode barcode
        const databaseProduk = {
            "8996001332011": "Mie Instan Goreng",
            "8992760121123": "Air Mineral 600ml",
            "8999999111222": "Roti Coklat"
        };

        let scannedData = {};
        let isCooldown = false; // Status untuk mengecek apakah sedang dalam masa jeda

        function onScanSuccess(decodedText, decodedResult) {
            // Jika sedang dalam masa jeda 10 detik, abaikan scan baru
            if (isCooldown) {
                return;
            }

            // Aktifkan status cooldown
            isCooldown = true;
            let sisaWaktu = 10;
            const statusBox = document.getElementById('statusScan');
            
            // Ubah warna kotak status jadi kuning (peringatan)
            statusBox.className = "alert alert-warning mt-3 py-2 mb-0";
            statusBox.innerText = `Berhasil Scan! Jeda: ${sisaWaktu} detik...`;

            // Proses penambahan data (qty +1)
            if (scannedData[decodedText]) {
                scannedData[decodedText].qty += 1;
            } else {
                let namaBarang = databaseProduk[decodedText] || "Barang Lainnya (Tidak Dikenal)";
                scannedData[decodedText] = {
                    nama: namaBarang,
                    qty: 1
                };
            }
            updateTabel();

            // Hitung mundur jeda waktu selama 10 detik
            let countdownInterval = setInterval(() => {
                sisaWaktu--;
                if (sisaWaktu > 0) {
                    statusBox.innerText = `Berhasil Scan! Jeda: ${sisaWaktu} detik...`;
                } else {
                    clearInterval(countdownInterval);
                    isCooldown = false; // Buka kembali kunci scanner
                    statusBox.className = "alert alert-success mt-3 py-2 mb-0";
                    statusBox.innerText = "Scanner Siap";
                }
            }, 1000);
        }

        function onScanFailure(error) {
            // Abaikan error pencarian frame kamera
        }

        function updateTabel() {
            const tbody = document.getElementById('tabelScan');
            tbody.innerHTML = "";

            let totalSemuaQty = 0;
            let keys = Object.keys(scannedData);

            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">Belum ada barcode yang disscan</td></tr>`;
                document.getElementById('totalQty').innerText = "0";
                return;
            }

            keys.forEach(code => {
                let item = scannedData[code];
                totalSemuaQty += item.qty;

                let row = `<tr>
                    <td><code>${code}</code></td>
                    <td>${item.nama}</td>
                    <td class="text-center"><strong>${item.qty}</strong></td>
                </tr>`;
                tbody.innerHTML += row;
            });

            document.getElementById('totalQty').innerText = totalSemuaQty;
        }

        function resetData() {
            scannedData = {};
            isCooldown = false;
            document.getElementById('statusScan').className = "alert alert-success mt-3 py-2 mb-0";
            document.getElementById('statusScan').innerText = "Scanner Siap";
            updateTabel();
        }

        // Inisialisasi Scanner Kamera
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: { width: 250, height: 150 } }, false);
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>

</body>
</html>

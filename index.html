<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conveyor Button Counter - Snapshot System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --text: #f8fafc;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
        
        header { text-align: center; margin-bottom: 4px; }
        header h1 { font-size: 1.25rem; color: var(--accent); font-weight: 700; }
        header p { font-size: 0.8rem; color: #94a3b8; }

        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }

        .viewport-box { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video, canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        #overlayCanvas { pointer-events: none; }

        .dashboard-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
        .stat-card .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 1.75rem; font-weight: 800; color: var(--success); margin-top: 2px; }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        button { background: var(--accent); color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        button.btn-danger { background: var(--danger); color: #fff; }
        button.btn-secondary { background: #475569; color: #fff; }

        .settings-group { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; font-size: 0.8rem; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }
        .setting-item input[type="range"] { width: 120px; accent-color: var(--accent); }

        .gallery-section { margin-top: 4px; }
        .gallery-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; color: #94a3b8; }
        .snapshot-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 140px; overflow-y: auto; padding: 4px; background: #0f172a; border-radius: 8px; border: 1px solid var(--border); }
        .snapshot-item { position: relative; aspect-ratio: 1; border-radius: 4px; overflow: hidden; border: 1px solid var(--success); background: #000; }
        .snapshot-item img { width: 100%; height: 100%; object-fit: cover; }
        .snapshot-item span { position: absolute; bottom: 0; width: 100%; font-size: 8px; background: rgba(0,0,0,0.7); color: #fff; text-align: center; }

        #hiddenCanvas { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Conveyor Snapshot Counter</h1>
            <p>Sistem Deteksi & Capture Otomatis Objek Bergerak</p>
        </header>

        <!-- VIEWPORT KAMERA -->
        <div class="card" style="padding: 6px;">
            <div class="viewport-box">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="overlayCanvas"></canvas>
            </div>
            <canvas id="hiddenCanvas"></canvas>
        </div>

        <!-- DASHBOARD STATISTIK -->
        <div class="dashboard-row">
            <div class="stat-card">
                <div class="label">Total Hitung</div>
                <div class="value" id="countVal">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Status Sensor</div>
                <div class="value" id="statusVal" style="font-size: 0.95rem; color: var(--accent); padding-top: 6px;">STANDBY</div>
            </div>
        </div>

        <!-- TOMBOL KONTROL -->
        <div class="controls-grid">
            <button id="btnToggle" onclick="toggleSystem()">MULAI SISTEM</button>
            <button class="btn-danger" onclick="resetCounter()">RESET COUNTER</button>
        </div>

        <!-- PENGATURAN / KALIBRASI -->
        <div class="card">
            <div style="font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; color: var(--accent);">Kalibrasi Sensor Tangkapan</div>
            <div class="settings-group">
                <div class="setting-item">
                    <span>Posisi Garis Trigger (Y)</span>
                    <input type="range" id="triggerLinePos" min="20" max="80" value="50" oninput="updateSettings()">
                </div>
                <div class="setting-item">
                    <span>Sensitivitas Gerak</span>
                    <input type="range" id="sensitivity" min="10" max="60" value="25" oninput="updateSettings()">
                </div>
                <div class="setting-item">
                    <span>Jeda Cooldown (ms)</span>
                    <input type="range" id="cooldownTime" min="200" max="2000" step="100" value="500" oninput="updateSettings()">
                </div>
            </div>
        </div>

        <!-- GALERI SNAPSHOT HASIL CAPTURE -->
        <div class="gallery-section card">
            <div class="gallery-title">
                <span>Galeri Snapshot Kancing Terhitung</span>
                <span id="galleryCount" style="font-size: 0.75rem;">0 item</span>
            </div>
            <div class="snapshot-grid" id="snapshotContainer">
                <!-- Preview tangkapan gambar akan muncul di sini -->
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
        
        const countVal = document.getElementById('countVal');
        const statusVal = document.getElementById('statusVal');
        const btnToggle = document.getElementById('btnToggle');
        const snapshotContainer = document.getElementById('snapshotContainer');
        const galleryCount = document.getElementById('galleryCount');

        let isRunning = false;
        let totalCount = 0;
        let lastCaptureTime = 0;
        
        // Pengaturan Kalibrasi
        let config = {
            lineYPercent: 0.5,
            threshold: 25,
            cooldown: 500
        };

        let prevFrameData = null;
        let animationId = null;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'environment' }
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        overlayCanvas.width = video.videoWidth;
                        overlayCanvas.height = video.videoHeight;
                        hiddenCanvas.width = video.videoWidth;
                        hiddenCanvas.height = video.videoHeight;
                        resolve();
                    };
                });
            } catch (err) {
                alert("Gagal mengakses kamera: " + err.message);
                statusVal.innerText = "ERROR";
            }
        }

        async function toggleSystem() {
            if (!isRunning) {
                await initCamera();
                isRunning = true;
                btnToggle.innerText = "HENTIKAN";
                btnToggle.className = "btn-secondary";
                statusVal.innerText = "AKTIF";
                statusVal.style.color = "var(--success)";
                prevFrameData = null;
                detectLoop();
            } else {
                isRunning = false;
                cancelAnimationFrame(animationId);
                btnToggle.innerText = "MULAI SISTEM";
                btnToggle.className = "";
                statusVal.innerText = "STANDBY";
                statusVal.style.color = "var(--accent)";
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            }
        }

        function updateSettings() {
            config.lineYPercent = document.getElementById('triggerLinePos').value / 100;
            config.sensitivity = parseInt(document.getElementById('sensitivity').value);
            config.cooldown = parseInt(document.getElementById('cooldownTime').value);
        }

        function detectLoop() {
            if (!isRunning) return;

            const w = hiddenCanvas.width;
            const h = hiddenCanvas.height;

            // Salin frame video saat ini ke canvas tersembunyi untuk analisis piksel
            hiddenCtx.drawImage(video, 0, 0, w, h);
            const currentFrame = hiddenCtx.getImageData(0, 0, w, h);
            const data = currentFrame.data;

            // Gambar ulang tampilan video ke layar utama dengan garis sensor
            overlayCtx.clearRect(0, 0, w, h);
            overlayCtx.drawImage(video, 0, 0, w, h);

            // Garis Trigger / Capture (Warna Hijau Terang)
            const triggerY = Math.floor(h * config.lineYPercent);
            overlayCtx.strokeStyle = "#22c55e";
            overlayCtx.lineWidth = 3;
            overlayCtx.beginPath();
            overlayCtx.moveTo(0, triggerY);
            overlayCtx.lineTo(w, triggerY);
            overlayCtx.stroke();

            // Label Garis Trigger
            overlayCtx.fillStyle = "#22c55e";
            overlayCtx.font = "12px sans-serif";
            overlayCtx.fillText("--- GARIS CAPTURE ---", 10, triggerY - 6);

            if (prevFrameData) {
                let motionPixels = 0;
                const scanHeightRange = 25; // Area deteksi tipis di sekitar garis trigger
                const startY = Math.max(0, triggerY - scanHeightRange);
                const endY = Math.min(h, triggerY + scanHeightRange);

                // Periksa perbedaan piksel (Motion Differencing) di sekitar garis trigger
                for (let y = startY; y < endY; y += 2) {
                    for (let x = 0; x < w; x += 4) {
                        const idx = (y * w + x) * 4;
                        const rDiff = Math.abs(data[idx] - prevFrameData.data[idx]);
                        const gDiff = Math.abs(data[idx+1] - prevFrameData.data[idx+1]);
                        const bDiff = Math.abs(data[idx+2] - prevFrameData.data[idx+2]);

                        if ((rDiff + gDiff + bDiff) / 3 > config.sensitivity) {
                            motionPixels++;
                        }
                    }
                }

                // Jika jumlah piksel bergerak melewati batas threshold, picu CAPTURE
                const now = Date.now();
                if (motionPixels > 40 && (now - lastCaptureTime > config.cooldown)) {
                    lastCaptureTime = now;
                    triggerCapture(triggerY);
                }
            }

            prevFrameData = currentFrame;
            animationId = requestAnimationFrame(detectLoop);
        }

        function triggerCapture(triggerY) {
            totalCount++;
            countVal.innerText = totalCount;

            // Efek visual kilat (flash) merah pada garis saat tertangkap
            overlayCtx.strokeStyle = "#ef4444";
            overlayCtx.lineWidth = 6;
            overlayCtx.beginPath();
            overlayCtx.moveTo(0, triggerY);
            overlayCtx.lineTo(overlayCanvas.width, triggerY);
            overlayCtx.stroke();

            // Potong area gambar (crop) di sekitar objek yang lewat sebagai snapshot
            const cropHeight = 80;
            const startY = Math.max(0, triggerY - (cropHeight / 2));
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 100;
            tempCanvas.height = 80;
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCtx.drawImage(
                video, 
                (video.videoWidth / 2) - 50, startY, 100, cropHeight, 
                0, 0, 100, 80
            );

            // Tambahkan ke galeri UI
            const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.8);
            addSnapshotToGallery(dataUrl, totalCount);
        }

        function addSnapshotToGallery(dataUrl, index) {
            const item = document.createElement('div');
            item.className = 'snapshot-item';
            item.innerHTML = `
                <img src="${dataUrl}" alt="Capture">
                <span>#${index}</span>
            `;
            snapshotContainer.prepend(item);
            galleryCount.innerText = `${totalCount} item`;

            // Batasi galeri maksimal 50 item terakhir agar memori tetap ringan
            if (snapshotContainer.children.length > 50) {
                snapshotContainer.removeChild(snapshotContainer.lastChild);
            }
        }

        function resetCounter() {
            totalCount = 0;
            countVal.innerText = "0";
            snapshotContainer.innerHTML = "";
            galleryCount.innerText = "0 item";
        }
    </script>
</body>
</html>

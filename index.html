<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Barcode - Mode Tangkap / Berhenti Otomatis</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Library Html5-Qrcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="text-center mb-4">Scan Barcode & Tangkap (Pause) Otomatis</h2>
        
        <div class="row">
            <!-- Kolom Kamera Scanner -->
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h5 id="statusKamera">Kamera Aktif</h5>
                        <div id="reader" style="width: 100%;"></div>
                        
                        <!-- Tombol untuk melanjutkan scan setelah dicapture -->
                        <div class="mt-3">
                            <button id="btnLanjut" class="btn btn-primary w-100" onclick="lanjutScan()" style="display: none;">
                                📥 Lanjut Scan Barang Berikutnya
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Kolom Tabel Hasil Scan & Hitung Otomatis -->
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Daftar Barang Terscan</h5>
                            <button class="btn btn-sm btn-outline-danger" onclick="resetData()">Reset Data</button>
                        </div>
                        
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Kode Barcode</th>
                                        <th>Nama Barang</th>
                                        <th class="text-center">Jumlah (Qty)</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelScan">
                                    <tr>
                                        <td colspan="3" class="text-center text-muted">Belum ada barcode yang disscan</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="mt-3 p-3 bg-white border rounded">
                            <h4>Total Keseluruhan Item: <span id="totalQty" class="text-primary">0</span> pcs</h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simulasi database nama barang
        const databaseProduk = {
            "8996001332011": "Mie Instan Goreng",
            "8992760121123": "Air Mineral 600ml",
            "8999999111222": "Roti Coklat"
        };

        let scannedData = {};
        let html5QrCode;
        let isScanning = true;

        // Inisialisasi Scanner menggunakan objek Html5Qrcode (bukan Scanner UI bawaan)
        html5QrCode = new Html5Qrcode("reader");

        const config = { fps: 10, qrbox: { width: 250, height: 150 } };

        // Fungsi ketika Barcode berhasil dibaca
        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanning) return; // Jika sedang dipause, abaikan
            
            // Hentikan (pause) scanner sementara setelah sukses scan
            isScanning = false;
            html5QrCode.pause(); // Menahan kamera agar tidak scan terus-menerus

            // Ubah teks status dan tampilkan tombol Lanjut
            document.getElementById('statusKamera').innerText = "Berhasil Dicapture!";
            document.getElementById('statusKameraclassName = "text-success fw-bold"');
            document.getElementById('btnLanjut').style.display = "block";

            // Proses penambahan data (Qty +1)
            if (scannedData[decodedText]) {
                scannedData[decodedText].qty += 1;
            } else {
                let namaBarang = databaseProduk[decodedText] || "Barang Lainnya (Tidak Dikenal)";
                scannedData[decodedText] = {
                    nama: namaBarang,
                    qty: 1
                };
            }
            updateTabel();
        }

        function onScanFailure(error) {
            // Error saat mencari frame diabaikan
        }

        // Fungsi untuk melanjutkan scan setelah tombol diklik
        function lanjutScan() {
            html5QrCode.resume(); // Lanjutkan kamera
            isScanning = true;
            document.getElementById('statusKamera').innerText = "Kamera Aktif";
            document.getElementById('btnLanjut').style.display = "none"; // Sembunyikan tombol lagi
        }

        // Mulai kamera saat halaman dimuat
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
            .catch(err => {
                alert("Gagal membuka kamera: " + err);
            });

        function updateTabel() {
            const tbody = document.getElementById('tabelScan');
            tbody.innerHTML = "";

            let totalSemuaQty = 0;
            let keys = Object.keys(scannedData);

            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">Belum ada barcode yang disscan</td></tr>`;
                document.getElementById('totalQty').innerText = "0";
                return;
            }

            keys.forEach(code => {
                let item = scannedData[code];
                totalSemuaQty += item.qty;

                let row = `<tr>
                    <td><code>${code}</code></td>
                    <td>${item.nama}</td>
                    <td class="text-center"><strong>${item.qty}</strong></td>
                </tr>`;
                tbody.innerHTML += row;
            });

            document.getElementById('totalQty').innerText = totalSemuaQty;
        }

        function resetData() {
            scannedData = {};
            updateTabel();
            if (!isScanning) {
                lanjutScan();
            }
        }
    </script>

</body>
</html>

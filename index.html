<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Camera Counter</title>
    <!-- Memuat TensorFlow.js dan model COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 400px; border-radius: 10px; transform: scaleX(-1); }
        #counter { font-size: 24px; font-weight: bold; color: #2c3e50; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Webcam Object Counter</h2>
    <video id="webcam" autoplay playsinline></video>
    <div id="counter">Memuat model AI...</div>

    <script>
        const video = document.getElementById('webcam');
        const counterDiv = document.getElementById('counter');
        let model = undefined;

        // 1. Mengaktifkan Kamera HP
        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' } // Menggunakan kamera belakang HP
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => { resolve(video); };
            });
        }

        // 2. Memuat Model AI & Menjalankan Deteksi
        async function run() {
            await setupCamera();
            model = await cocoSsd.load();
            counterDiv.innerText = "Model siap. Menghitung...";
            detectFrame();
        }

        // 3. Loop Deteksi Real-time
        async function detectFrame() {
            if (model) {
                const predictions = await model.detect(video);
                
                // Filter objek yang ingin dihitung, contoh: 'person' (orang)
                const targetObjects = predictions.filter(p => p.class === 'person');
                
                counterDiv.innerText = `Jumlah Terdeteksi: ${targetObjects.length}`;
            }
            requestAnimationFrame(detectFrame);
        }

        run();
    </script>
</body>
</html>

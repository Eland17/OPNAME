<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Crossing Object Counter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 10px; background: #f4f4f9; }
        .container { position: relative; display: inline-block; }
        video, canvas { width: 100%; max-width: 450px; border-radius: 10px; display: block; margin: auto; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        #counter-box { font-size: 22px; font-weight: bold; color: #d9534f; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Line Crossing Counter (Kamera HP)</h2>
    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>
    <div id="counter-box">Total Lewat: <span id="count">0</span></div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const countSpan = document.getElementById('count');

        let model = null;
        let totalCount = 0;
        // Menyimpan status posisi objek sebelumnya untuk melacak perpindahan
        let trackedObjects = {}; 

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480, facingMode: 'environment' }
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve(video);
                };
            });
        }

        async function run() {
            await setupCamera();
            model = await cocoSsd.load();
            document.getElementById('counter-box').innerText = "Sistem Aktif. Menghitung Objek Lewat...";
            detectFrame();
        }

        async function detectFrame() {
            if (model) {
                const predictions = await model.detect(video);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Buat garis virtual di tengah tinggi video (Y axis)
                const lineY = canvas.height / 2;
                ctx.strokeStyle = "red";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, lineY);
                ctx.lineTo(canvas.width, lineY);
                ctx.stroke();

                // Filter hanya objek 'person'
                const persons = predictions.filter(p => p.class === 'person');
                let currentFrameObjects = {};

                persons.forEach((person, index) => {
                    const [x, y, width, height] = person.bbox;
                    const centerX = x + width / 2;
                    const centerY = y + height / 2;

                    // Cari ID sederhana berdasarkan kedekatan posisi dari frame sebelumnya
                    let matchedId = null;
                    for (let id in trackedObjects) {
                        let prev = trackedObjects[id];
                        let dist = Math.hypot(prev.x - centerX, prev.y - centerY);
                        if (dist < 80) { // Toleransi jarak geser antar frame
                            matchedId = id;
                            break;
                        }
                    }

                    if (!matchedId) {
                        matchedId = 'obj_' + Math.random().toString(36).substr(2, 5);
                    }

                    // Cek apakah objek melintasi garis (dari atas ke bawah garis Y)
                    if (trackedObjects[matchedId]) {
                        let prevY = trackedObjects[matchedId].y;
                        if (prevY < lineY && centerY >= lineY) {
                            totalCount++;
                            countSpan.innerText = totalCount;
                        }
                    }

                    currentFrameObjects[matchedId] = { x: centerX, y: centerY };

                    // Gambar kotak dan titik tengah di canvas
                    ctx.strokeStyle = "#00FF00";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, width, height);
                    ctx.fillStyle = "yellow";
                    ctx.fillRect(centerX - 4, centerY - 4, 8, 8);
                });

                trackedObjects = currentFrameObjects;
            }
            requestAnimationFrame(detectFrame);
        }

        run();
    </script>
</body>
</html>
